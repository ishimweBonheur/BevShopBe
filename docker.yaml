services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bevshop
      POSTGRES_USER: bevshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local Docker use}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
