x-database: &database
  DATABASE_HOST: ${DATABASE_HOST:-postgres}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_NAME: ${DATABASE_NAME:-beverages}
  DATABASE_USER: ${DATABASE_USER:-postgresql}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}

x-app: &app
  build:
    context: .
    dockerfile: dockerfile
  image: bevshop-api:local
  networks:
    - bevshop-network

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-beverages}
      POSTGRES_USER: ${DATABASE_USER:-postgresql}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      TZ: ${TZ:-Africa/Kigali}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bevshop-network

  migrate:
    <<: *app
    restart: "no"
    command: ["./bevshop-migrate"]
    environment: *database
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bevshop-network

  api:
    <<: *app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *database
      PORT: ${PORT:-8081}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$PORT/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bevshop-network

networks:
  bevshop-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
